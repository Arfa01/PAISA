[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paisa-v0"
version = "0.1.0"
description = "PAISA v0: PSX stock-data ingestion, cleaning, feature generation, baseline model, and FastAPI service."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Arfa Riaz"},
  {name = "Waqas Ul Hasan"}
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
