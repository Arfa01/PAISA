[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paisa-v0"
version = "0.1.0"
description = "PAISA v0: PSX stock-data ingestion, cleaning, feature generation, baseline model, and FastAPI service."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Arfa Riaz"},
  {name = "Waqas Ul Hasan"}
]
dependencies = [
  "pandas>=2.2.0,<3.0.0",
  "numpy>=1.26.0,<2.4.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.3.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "matplotlib>=3.8.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pypsx-toolkit>=3.1.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
